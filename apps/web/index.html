<!doctype html>
<html lang="fr">
      <head>
            <meta charset="UTF-8" />
            <link rel="icon" href="/assets/feo-app-logo.png" />
            <link rel="apple-touch-icon" href="/assets/feo-app-logo.png" />
            <link rel="manifest" href="/manifest.json" />
            <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
            />
            <meta name="apple-mobile-web-app-capable" content="yes" />
            <meta
                  name="apple-mobile-web-app-status-bar-style"
                  content="black-translucent"
            />
            <meta name="apple-mobile-web-app-title" content="Feo" />
            <meta name="mobile-web-app-capable" content="yes" />
            <meta name="theme-color" content="#000000" />
            <meta name="description" content="FEO — écoute toute la musique, avec une IA qui compose tes playlists et ta radio." />
            <meta name="application-name" content="Feo" />
            <script>
                  try {
                        var t = localStorage.getItem("feo_theme");
                        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                        document.documentElement.dataset.theme = t;
                  } catch (e) { document.documentElement.dataset.theme = "dark"; }
            </script>
            <title>FEO — Henoy ara</title>
            <link rel="preconnect" href="https://fonts.googleapis.com" />
            <link
                  rel="preconnect"
                  href="https://fonts.gstatic.com"
                  crossorigin
            />
            <link
                  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap"
                  rel="stylesheet"
            />
      </head>
      <body>
            <div id="root"></div>
            <script>
                  if ("serviceWorker" in navigator) {
                        window.addEventListener("load", () => {
                              navigator.serviceWorker.register("/sw.js");
                        });
                  }
            </script>
            <script type="module" src="/src/main.tsx"></script>
      </body>
</html>
