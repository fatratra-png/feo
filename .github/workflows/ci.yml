name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + API integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feo
          POSTGRES_PASSWORD: feo
          POSTGRES_DB: feo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U feo" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      TEST_DATABASE_URL: postgresql://feo:feo@localhost:5432/feo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    name: End-to-end (Cypress)
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feo
          POSTGRES_PASSWORD: feo
          POSTGRES_DB: feo_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U feo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://feo:feo@localhost:5432/feo_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/backend
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: apps/web/cypress/screenshots
          if-no-files-found: ignore
